name: Generate wallpapers manifest

on:
  push:
    branches: [main]
    paths:
      - "walls/**.jpg"
      - "walls/**.jpeg"
      - "walls/**.png"
      - "walls/**.webp"
      - "walls/**.gif"
      - "walls/**.bmp"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # REQUIRED for git history sorting

      - name: Generate wallpapers.json
        run: |
          echo "Generating wallpapers manifest..."

          # Simply find all image files in walls directory
          if [ -d "walls" ]; then
            files=$(find walls -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.webp" -o -name "*.gif" -o -name "*.bmp" \) | sort -r)
            count=$(echo "$files" | grep -c .)
          else
            files=""
            count=0
          fi

          # Generate JSON
          if [ -n "$files" ] && [ "$count" -gt 0 ]; then
            files_json=$(echo "$files" | jq -R . | jq -s .)
          else
            files_json="[]"
            count=0
          fi

          jq -n \
            --argjson count "$count" \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$files_json" \
            '{count: $count, updated: $updated, files: $files}' \
            > wallpapers.json

          echo "Generated wallpapers.json with $count files"

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add wallpapers.json
          git commit -m "auto: update wallpapers manifest" || exit 0
          git push
