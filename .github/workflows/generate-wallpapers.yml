name: Generate wallpapers manifest

on:
  push:
    branches: [main]
    paths:
      - "walls/**.jpg"
      - "walls/**.jpeg"
      - "walls/**.png"
      - "walls/**.webp"
      - "walls/**.gif"
      - "walls/**.bmp"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # REQUIRED for git history sorting

      - name: Generate wallpapers.json
        run: |
          echo "Generating wallpapers manifest..."

          files=$(git log --name-only --pretty=format: --diff-filter=A \
            | grep -E '^walls/.*\.(jpg|jpeg|png|webp|gif|bmp)$' \
            | sort -u \
            | grep -v '^$')

          if [ -z "$files" ]; then
            echo "No wallpaper files found in walls/ directory"
            files=""
            count=0
          else
            files=$(echo "$files" | tac)
            count=$(echo "$files" | wc -l | tr -d ' ')
          fi

          jq -n \
            --argjson count "$count" \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson files "$(if [ -n \"$files\" ]; then printf '%s\n' $files | jq -R . | jq -s .; else echo '[]'; fi)" \
            '{count: $count, updated: $updated, files: $files}' \
            > wallpapers.json

          echo "Generated wallpapers.json with $count files"

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add wallpapers.json
          git commit -m "auto: update wallpapers manifest" || exit 0
          git push
